# S2 lab customer Acme · PROD. Do not attach renzo-* or webhosting_renzo_* volumes.
name: lab-acme-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: martial-arts-acquisition:s2
    container_name: lab-acme-prod-app
    init: true
    restart: unless-stopped
    env_file:
      - path: .env.lab-acme-prod
        required: false
      - path: .env.lab-acme-prod.example
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5000"
      APP_ENV: production
      NUXT_PUBLIC_APP_ENV: production
      DATABASE_URL: file:/app/data/sqlite/crm.sqlite
      ASSET_UPLOAD_DIR: /app/data/uploads
      DRIZZLE_MIGRATIONS_DIR: /app/drizzle/migrations
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?Set NUXT_SESSION_PASSWORD in the lab env file}
      NUXT_AUTH_USERNAME: ${NUXT_AUTH_USERNAME:-admin}
      NUXT_AUTH_EMAIL: ${NUXT_AUTH_EMAIL:-admin@lab-acme-prod.local}
      NUXT_AUTH_PASSWORD: ${NUXT_AUTH_PASSWORD:?Set NUXT_AUTH_PASSWORD in the lab env file}
      NUXT_AUTH_RESET_PASSWORD: ${NUXT_AUTH_RESET_PASSWORD:-false}
      NUXT_PUBLIC_APP_NAME: ${NUXT_PUBLIC_APP_NAME:-Acme BJJ Acquisition}
      NUXT_PUBLIC_BRAND_NAME: ${NUXT_PUBLIC_BRAND_NAME:-Acme BJJ}
      NUXT_PUBLIC_BRAND_LOCATION: ${NUXT_PUBLIC_BRAND_LOCATION:-Lab PROD}
      NUXT_PUBLIC_TIMEZONE: ${NUXT_PUBLIC_TIMEZONE:-America/Denver}
    ports:
      - "52040:5000"
    volumes:
      - lab-acme-prod-sqlite:/app/data/sqlite
      - lab-acme-prod-assets:/app/data/uploads
    networks:
      - lab-acme-prod-net

volumes:
  lab-acme-prod-sqlite:
    name: lab-acme-prod-sqlite
  lab-acme-prod-assets:
    name: lab-acme-prod-assets

networks:
  lab-acme-prod-net:
    name: lab-acme-prod-net
